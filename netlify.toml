[build]
  command = "vite build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Fase 6: kirim antrian pesan Telegram & jadwal kehadiran mingguan, tiap menit
[functions."telegram-antrian"]
  schedule = "* * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
