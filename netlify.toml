[build]
  command = "vite build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Fase 6: kirim antrian pesan Telegram & jadwal kehadiran mingguan, tiap menit
[functions."telegram-antrian"]
  schedule = "* * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fase 7 · PWA: service worker, html & manifest selalu dicek ulang; aset ber-hash boleh disimpan lama.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
